name: Deploy

# Every push to main publishes to https://reallyitsandi.com/3DLivingSpace/.
# The site is static and has no build step, so the job stages the public files
# and rsyncs them to the droplet.
#
# The deploy key is pinned on the droplet to rrsync in
# /srv/sites/reallyitsandi.com/3DLivingSpace, so it can write that directory and
# nothing else, and Portfolio-Site's deploy protects /3DLivingSpace/ from its
# --delete. Both are set up by deploy/3dlivingspace-key.sh in Portfolio-Site.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pinned to a commit, as in the other sites on this box: the job holds a
      # deploy key, and a tag can be moved onto new code.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage site
        run: |
          mkdir dist
          cp -R index.html src assets dist/

      - name: Load deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must both be set"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      # --delay-updates and --delete-after swap the new files in as one batch, so
      # a visitor mid-deploy never loads a module from one version and its
      # imports from another.
      - name: Deploy to droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -rltpvz --delete --delete-after --delay-updates \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30' \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:/"
